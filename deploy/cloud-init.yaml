#cloud-config
# Первоначальная настройка сервера под Swiper (Ubuntu 24.04).
#
# Что делает: заводит пользователя swiper, ставит Node 22, git, nginx,
# поднимает приёмник кода с автосборкой и службу приложения.
# Выкладка потом — одной командой с ноутбука: git push server master

package_update: true
package_upgrade: true

users:
  - name: swiper
    groups: [sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ssh-rsa  timycmorozov5795@gmail.com

# nodejs здесь намеренно нет: из репозитория Ubuntu приедет 18-я версия,
# а проекту нужна 20+. Ставим её ниже, из NodeSource.
packages:
  - git
  - tmux
  - nginx
  - curl
  - ca-certificates
  - rsync
  # Нужен setfacl: nginx читает картинки из каталога данных, но остального
  # в нём видеть не должен.
  - acl

write_files:
  # ---------------------------------------------------------- служба
  - path: /etc/systemd/system/swiper.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Swiper
      After=network.target

      [Service]
      Type=simple
      User=swiper
      WorkingDirectory=/home/swiper/app
      EnvironmentFile=/home/swiper/.env.production
      ExecStart=/usr/bin/npm run start
      Restart=always
      RestartSec=5
      # Писать приложение может только в свой каталог данных и в свою сборку:
      # Next.js держит кэш в .next/cache.
      ProtectSystem=strict
      # Дефис перед путём — «не падать, если каталога нет»: npm заводит ~/.npm
      # сам и пишет туда логи при ошибках.
      ReadWritePaths=/var/lib/swiper /home/swiper/app -/home/swiper/.npm
      PrivateTmp=true
      NoNewPrivileges=true

      [Install]
      WantedBy=multi-user.target

  # ------------------------------------------------------------ nginx
  - path: /etc/nginx/sites-available/swiper
    permissions: "0644"
    content: |
      server {
          listen 80 default_server;
          server_name _;

          # Фотография к желанию в вишлисте прилетает файлом из галереи, и
          # снимок с телефона легко весит несколько мегабайт. Само
          # приложение отказывает после 12 МБ; здесь запас на обвязку
          # multipart, иначе отказывал бы nginx — страницей, а не понятным
          # сообщением.
          client_max_body_size 15m;

          # Настройки проксирования заданы на уровне server: их наследуют обе
          # location ниже, которые ходят в приложение.
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          # По этому заголовку работает защита от перебора паролей:
          # без него все посетители выглядят как один.
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;

          # Картинки отдаёт nginx, а не Node (см. сниппет ниже).
          include snippets/swiper-media.conf;

          location / {
              proxy_pass http://127.0.0.1:3000;
          }
      }

  # ------------------------------- раздача картинок мимо приложения
  # Чтение файла с диска — самая частая операция приложения, и в Node она
  # стоит в одной очереди с лентой и свайпами: пока процесс отдаёт мегабайт
  # картинок, он не отвечает ни на что другое. nginx делает это, не занимая
  # процесс приложения вовсе.
  #
  # Вынесено в отдельный файл, чтобы на работающем сервере правка сводилась к
  # одной строке include в конфиге сайта — его мог менять certbot.
  - path: /etc/nginx/snippets/swiper-media.conf
    permissions: "0644"
    content: |
      # Имя сверяем тем же шаблоном, что и приложение: в каталоге картинок
      # рядом лежит manifest.json со списком первоисточников, и отдавать его
      # наружу незачем. Кавычки вокруг регулярки обязательны: без них nginx
      # читает {32} как начало блока.
      location ~ "^/media/([a-f0-9]{32}(?:-t)?\.webp)$" {
          alias /var/lib/swiper/images/$1;
          # Промах — не 404: приложение в этом случае уводит на первоисточник,
          # и карточка остаётся с фотографией.
          error_page 404 = @app;
          # В каталоге только webp, а полагаться на mime.types незачем.
          types { }
          default_type image/webp;
          add_header Cache-Control "public, max-age=31536000, immutable" always;
          access_log off;
      }

      # Фотографии, приложенные к желаниям в вишлисте. Имя — хэш содержимого,
      # поэтому файл по адресу никогда не меняется.
      location ~ "^/uploads/([a-f0-9]{32}\.webp)$" {
          alias /var/lib/swiper/uploads/$1;
          error_page 404 = @app;
          types { }
          default_type image/webp;
          add_header Cache-Control "public, max-age=31536000, immutable" always;
          access_log off;
      }

      # Сюда попадают промахи: дальше разбирается приложение. Заголовки
      # перечислены заново — сниппет должен работать сам по себе, где бы его
      # ни подключили.
      location @app {
          proxy_pass http://127.0.0.1:3000;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
      }

  # ---------------------------- выкладка: общая часть для обоих путей
  # Источник правды на сервере — репозиторий /home/swiper/repo.git. Его
  # наполняет либо сам сервер с GitHub, либо push с ноутбука, если GitHub
  # с этого хостинга недоступен. Сборка в обоих случаях одна и та же.
  - path: /usr/local/bin/swiper-build
    permissions: "0755"
    content: |
      #!/bin/bash
      set -e
      export PATH=/usr/local/bin:/usr/bin:/bin
      APP=/home/swiper/app
      REPO=/home/swiper/repo.git

      echo "→ выкладываю код"
      mkdir -p "$APP"
      git --work-tree="$APP" --git-dir="$REPO" checkout -f master

      cd "$APP"
      echo "→ ставлю зависимости (это долго)"
      npm ci --no-audit --no-fund

      echo "→ собираю"
      npm run build

      echo "→ перезапускаю службу"
      sudo systemctl restart swiper
      echo "✓ готово"

  # ------------------------------------- обновление прямо с GitHub
  - path: /usr/local/bin/swiper-update
    permissions: "0755"
    content: |
      #!/bin/bash
      set -e
      export PATH=/usr/local/bin:/usr/bin:/bin
      REPO=/home/swiper/repo.git
      URL=https://github.com/timofeyka201/telegram-email-bot.git

      echo "→ забираю свежий код с GitHub"
      # Ограничение по времени: некоторые российские хостинги до GitHub не
      # достают, и без него команда висела бы минутами. Неудачу именно этого
      # шага называем отдельно — иначе поломка сборки выглядит как проблема
      # с сетью, и чинят не то.
      if ! timeout 180 git --git-dir="$REPO" fetch --depth 20 "$URL" "+master:master"; then
        echo "✗ GitHub с этого сервера недоступен."
        echo "  Пришлите код с ноутбука: git push server master"
        exit 2
      fi

      exec /usr/local/bin/swiper-build

  # ------------------------- приём кода, отправленного с ноутбука
  - path: /usr/local/bin/swiper-post-receive
    permissions: "0755"
    content: |
      #!/bin/bash
      exec /usr/local/bin/swiper-build

runcmd:
  # Сборка Next.js требует около 1,5 ГБ. На тарифах с 1 ГБ без свопа она
  # падает по памяти, поэтому добавляем его заранее — лишним не будет.
  - [sh, -c, "test -f /swapfile || (fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab)"]

  # Node 22 из NodeSource.
  - [sh, -c, "curl -fsSL https://deb.nodesource.com/setup_22.x | bash -"]
  - [apt-get, install, -y, nodejs]

  # Медленный канал до реестра npm — увеличиваем терпение.
  - [sudo, -u, swiper, npm, config, set, fetch-timeout, "600000"]
  - [sudo, -u, swiper, npm, config, set, fetch-retries, "5"]

  # Каталог данных: учётные записи живут отдельно от кода, чтобы выкладка
  # их не задевала.
  - [mkdir, -p, /var/lib/swiper/images, /var/lib/swiper/uploads]
  - [chown, -R, "swiper:swiper", /var/lib/swiper]
  - [chmod, "700", /var/lib/swiper]

  # Картинки отдаёт nginx, поэтому www-data нужен доступ внутрь каталога
  # данных. Даём ровно его: право войти в /var/lib/swiper (без права
  # посмотреть, что там лежит) и чтение двух каталогов с картинками. Учётные
  # записи, снапшот каталога и всё остальное остаются недоступны.
  - [setfacl, -m, "u:www-data:x", /var/lib/swiper]
  - [setfacl, -R, -m, "u:www-data:rX", /var/lib/swiper/images, /var/lib/swiper/uploads]
  # То же самое для файлов, которые появятся позже: импортёр качает картинки,
  # люди прикладывают фотографии к желаниям.
  - [setfacl, -R, -d, -m, "u:www-data:rX", /var/lib/swiper/images, /var/lib/swiper/uploads]

  # Приёмник кода: сюда вы пушите с ноутбука, минуя GitHub.
  - [sudo, -u, swiper, git, init, --bare, /home/swiper/repo.git]
  - [cp, /usr/local/bin/swiper-post-receive, /home/swiper/repo.git/hooks/post-receive]
  - [chmod, "+x", /home/swiper/repo.git/hooks/post-receive]
  - [chown, -R, "swiper:swiper", /home/swiper/repo.git]

  # Настройки приложения. Адрес определяем сам — по нему строятся ссылки в
  # письмах и решается, ставить ли куке флаг Secure.
  - [sh, -c, "IP=$(ip -4 route get 1.1.1.1 2>/dev/null | awk '{print $7; exit}'); [ -n \"$IP\" ] || IP=$(hostname -I | awk '{print $1}'); printf 'APP_URL=http://%s\\nAUTH_FILE=/var/lib/swiper/auth.json\\nNODE_ENV=production\\n' \"$IP\" > /home/swiper/.env.production"]
  - [chown, "swiper:swiper", /home/swiper/.env.production]
  - [chmod, "600", /home/swiper/.env.production]

  # nginx
  - [ln, -sf, /etc/nginx/sites-available/swiper, /etc/nginx/sites-enabled/swiper]
  - [rm, -f, /etc/nginx/sites-enabled/default]
  - [nginx, -t]
  - [systemctl, reload, nginx]

  # Брандмауэр
  - [ufw, allow, OpenSSH]
  - [ufw, allow, "80"]
  - [ufw, allow, "443"]
  - [sh, -c, "ufw --force enable"]

  # Служба включена, но не запущена: кода ещё нет, он приедет первым push'ем.
  - [systemctl, daemon-reload]
  - [systemctl, enable, swiper]

  # Пробуем поднять приложение сразу: тянем код с GitHub и собираем. Если
  # GitHub с этого хостинга недоступен, сервер остаётся готовым принять код
  # с ноутбука командой git push server master.
  - [sh, -c, "node -v > /var/log/swiper-init.log 2>&1"]
  - [sh, -c, "sudo -u swiper /usr/local/bin/swiper-update >> /var/log/swiper-init.log 2>&1 || echo '✗ первая выкладка не удалась, смотрите вывод выше' >> /var/log/swiper-init.log"]
  - [sh, -c, "echo 'cloud-init завершён' >> /var/log/swiper-init.log"]

final_message: "Сервер готов. Дальше — git push server master с ноутбука."
